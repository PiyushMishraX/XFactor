# X FACTOR — full stack for the hackathon demonstration.
#
#   docker compose up --build
#   Frontend: http://localhost:8080      API docs: http://localhost:8000/docs
#
# Secrets (GEMINI_API_KEY, APPROVER_CREDENTIALS, SAP_*, ...) are read from
# backend/.env, which is never copied into an image. The database variables
# below deliberately point the containers at the bundled PostgreSQL service and
# override any DATABASE_URL in backend/.env, so the demo is self-contained.
# To use an external database instead, edit this file and set DATABASE_URL.

name: xfactor

x-backend-environment: &backend-environment
  DATABASE_URL: ""
  POSTGRES_HOST: db
  POSTGRES_PORT: "5432"
  POSTGRES_USER: ${POSTGRES_USER:-xfactor}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-xfactor}
  POSTGRES_DB: ${POSTGRES_DB:-xfactor}
  LANGGRAPH_CHECKPOINT_BACKEND: postgres
  CORS_ORIGINS: http://localhost:8080,http://127.0.0.1:8080

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-xfactor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-xfactor}
      POSTGRES_DB: ${POSTGRES_DB:-xfactor}
    volumes:
      # Named volume keeps workflow checkpoints and run history across restarts.
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  seed:
    build: ./backend
    env_file:
      - path: ./backend/.env
        required: false
    environment: *backend-environment
    command: ["python", "-m", "scripts.seed_reference_data"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    build: ./backend
    env_file:
      - path: ./backend/.env
        required: false
    environment: *backend-environment
    depends_on:
      db:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    stop_grace_period: 30s
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  postgres-data:
